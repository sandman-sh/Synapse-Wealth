<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#061826" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="8" />
  
  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)" />

  <!-- Synapse Node Lines -->
  <path d="M140 340 L256 120 L372 340 L256 280 Z" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.5" stroke-dasharray="10 10" fill="none" />
  
  <line x1="256" y1="120" x2="256" y2="400" stroke="#06b6d4" stroke-width="4" stroke-opacity="0.4" />
  <line x1="140" y1="340" x2="372" y2="340" stroke="#06b6d4" stroke-width="4" stroke-opacity="0.4" />

  <!-- Synapse Nodes -->
  <circle cx="256" cy="120" r="16" fill="#22d3ee" filter="url(#glow)" />
  <circle cx="140" cy="340" r="16" fill="#818cf8" filter="url(#glow)" />
  <circle cx="372" cy="340" r="16" fill="#a855f7" filter="url(#glow)" />
  <circle cx="256" cy="280" r="12" fill="#38bdf8" />

  <!-- Lightning Bolt Central Icon -->
  <path d="M276 90 L176 270 H266 L236 422 L336 242 H246 L276 90 Z" fill="url(#boltGrad)" filter="url(#glow)" />
</svg>
